experiment:
  name: tiny_local
  seed: 42
  output_root: outputs/runs

model:
  name: hf-internal-testing/tiny-random-Qwen2ForCausalLM
  dtype: float32
  device_map: null

data:
  generated_facts: 40
  acquisition_size: 20
  holdout_size: 10
  forget_ratio: 0.2
  validation_ratio: 0.2
  categories: [capital, inventor, acquisition, author, founding]

acquisition:
  epochs: 1
  learning_rate: 0.0002
  batch_size: 2
  max_length: 128
  lora_rank: 4
  lora_alpha: 8
  lora_dropout: 0.05

unlearning:
  methods: [ga, npo]
  update_mode: lora
  retain_loss: nll
  epochs: 1
  learning_rate: 0.00001
  batch_size: 2
  max_length: 128
  beta: 0.1
  simnpo_delta: 0.0
  forget_weight: 1.0
  retain_weight: 1.0
  retain_match_floor: 0.4

evaluation:
  max_new_tokens: 24
  filter_batch_size: 4
  prompt_types: [original, paraphrase, zh, mixed]
  base_knowledge_threshold: 0.05
  acquisition_threshold: 0.60
  merge_max_delta: 0.05
