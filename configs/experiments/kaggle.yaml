experiment:
  name: kaggle
  seed: 42
  output_root: /kaggle/working/outputs/runs

model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
  device_map: auto

data:
  generated_facts: 600
  acquisition_size: 250
  holdout_size: 100
  forget_ratio: 0.2
  validation_ratio: 0.1
  categories: [capital, inventor, acquisition, author, founding]

acquisition:
  epochs: 3
  learning_rate: 0.0002
  batch_size: 4
  max_length: 256
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05

unlearning:
  methods: [ga, npo]
  update_mode: lora
  retain_loss: nll
  epochs: 3
  learning_rate: 0.00001
  batch_size: 4
  max_length: 256
  beta: 0.1
  simnpo_delta: 0.0
  forget_weight: 1.0
  retain_weight: 1.0
  retain_match_floor: 0.5

evaluation:
  max_new_tokens: 24
  filter_batch_size: 32
  prompt_types: [original, paraphrase]
  base_knowledge_threshold: 0.05
  acquisition_threshold: 0.60
  merge_max_delta: 0.05

