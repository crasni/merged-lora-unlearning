experiment:
  name: 1_5b_paper_base
  seed: 42
  output_root: outputs/runs

model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  dtype: float16
  device_map: auto

data:
  generated_facts: 1000
  acquisition_size: 300
  holdout_size: 120
  forget_ratio: 0.2
  validation_ratio: 0.1
  categories: [capital, inventor, acquisition, author, founding]

acquisition:
  epochs: 18
  learning_rate: 0.001
  batch_size: 2
  max_length: 256
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.0

unlearning:
  methods: []
  update_mode: lora
  epochs: 6
  learning_rate: 0.00001
  batch_size: 2
  max_length: 256
  beta: 0.1
  simnpo_delta: 0.0
  gamma: 1.0
  alpha: 1.0
  retain_match_floor: 0.80
  checkpoint_every_epochs: 2

evaluation:
  max_new_tokens: 24
  filter_batch_size: 16
  prompt_types: [original, paraphrase, zh, mixed]
  base_knowledge_threshold: 0.05
  acquisition_threshold: 0.60
  merge_max_delta: 0.05
  general_utility: true
