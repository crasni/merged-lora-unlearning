experiment:
  name: 1_5b_paper
  seed: 42
  output_root: outputs/runs
  reuse_from: 1_5b_paper_base
  forget_request_ratio: 0.20

model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  dtype: float16
  device_map: auto

data:
  generated_facts: 1500
  acquisition_size: 500
  holdout_size: 150
  forget_ratio: 0.2
  validation_ratio: 0.1
  categories: [capital, inventor, acquisition, author, founding]

acquisition:
  epochs: 12
  learning_rate: 0.0005
  batch_size: 2
  max_length: 256
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.0

unlearning:
  methods: [ga, grad_diff, ga_kl, npo, npo_grad_diff, npo_kl, simnpo, simnpo_grad_diff, simnpo_kl]
  update_mode: lora
  epochs: 6
  learning_rate: 0.00001
  batch_size: 2
  max_length: 256
  beta: 0.1
  simnpo_delta: 0.0
  gamma: 1.0
  alpha: 1.0
  retain_match_floor: 0.75
  checkpoint_every_epochs: 2
  method_overrides:
    ga:
      learning_rate: 0.00002
    grad_diff:
      learning_rate: 0.00003
      alpha: 0.3
    ga_kl:
      learning_rate: 0.00002
      alpha: 0.1
    npo:
      learning_rate: 0.00003
    npo_grad_diff:
      learning_rate: 0.00003
      alpha: 0.3
    npo_kl:
      learning_rate: 0.00003
      alpha: 0.1
    simnpo:
      beta: 0.7
    simnpo_grad_diff:
      beta: 0.7
      alpha: 0.1
    simnpo_kl:
      beta: 0.7
      alpha: 0.05

evaluation:
  max_new_tokens: 24
  filter_batch_size: 16
  prompt_types: [original, paraphrase, mixed]
  base_knowledge_threshold: 0.05
  acquisition_threshold: 0.60
  merge_max_delta: 0.05
  general_utility: true
